# Words from the "Do not use" column of docs/glossary.md that have no
# other common meaning. Update this list in the same PR as the glossary.
# Skipped on purpose: "one" (also a number) and "user" (a glossary term).
extends: substitution
message: "Use '%s' instead of '%s' (docs/glossary.md)."
level: error
ignorecase: true
swap:
  we: you
  the developer: you
  approver: reviewer
  customer: user
  fake account: bot
  real account: human
  organic account: human
  bot score: bot probability
  cutoff: bot threshold
  ground truth: label
  crawler: scraper
  fetcher: scraper
  detector: classifier
  model client: classifier
  encoder: embedder
  model server: inference server
  managed model: hosted backend
  local model: self-hosted backend
  own model: self-hosted backend
  inference service: inference server
  python server: reference server
  oracle: reference server
  rust server: candle server
  error queue: dead-letter queue
  scrape job: scraper job
  crawl job: scraper job
  classify job: classifier job
  micro-batching: dynamic batching
  mock: fake
  stub: fake
  dummy: fake
  mock data: fixture
  sample data: fixture
  the llm: Clef-flash
  model id: model version
  checkpoint: model version
  quant: variant
  test set: eval set
  benchmark data: eval set
  eval run: experiment
  writeup: eval report
  confidence accuracy: calibration
  perf test: load test or benchmark
  stress test: load test
  sprint: milestone
  exit criteria: gate
  poc: spike
  design doc: decision record
  feature set: metadata version
  prompt version: question version
  consumer: worker
  processor: worker
