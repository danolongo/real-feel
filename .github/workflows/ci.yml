name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgres://realfeel:ci-password@localhost:5433/realfeel
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --wait postgres
      - name: Apply the migrations so the sqlx macros can check queries
        run: |
          for file in crates/db/migrations/*.sql; do
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -q -U realfeel -d realfeel < "$file"
          done
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgres://realfeel:ci-password@localhost:5433/realfeel
      SCRAPER_QUEUE_URL: http://localhost:4566/000000000000/scraper-jobs
      CLASSIFIER_QUEUE_URL: http://localhost:4566/000000000000/classifier-jobs
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --wait
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Apply the migrations so the sqlx macros can check queries
        run: |
          for file in crates/db/migrations/*.sql; do
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -q -U realfeel -d realfeel < "$file"
          done
      - name: Run the integration tests
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.features | has("integration")) | .name')
          args=()
          for package in $packages; do
            args+=(-p "$package" --features "$package/integration")
          done
          cargo test "${args[@]}"

  e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgres://realfeel:ci-password@localhost:5433/realfeel
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --wait
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Apply the migrations so the sqlx macros can check queries
        run: |
          for file in crates/db/migrations/*.sql; do
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -q -U realfeel -d realfeel < "$file"
          done
      - name: Run the end-to-end test
        run: cargo test -p worker --features e2e

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config .lychee.toml '**/*.md'
          fail: true

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the PR title and every commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commits.sh "${BASE_SHA}..${HEAD_SHA}"
