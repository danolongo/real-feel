[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "derive", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Dependencies build without debug info. This shrinks target/ and speeds up linking.
[profile.dev.package."*"]
debug = false

# Release code with line tables, so perf and inferno can name the functions in a flame graph.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
