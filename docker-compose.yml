services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: realfeel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: realfeel
    ports:
      # 5432 conflicts with a Homebrew Postgres
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realfeel -d realfeel"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh

  jaeger:
    image: jaegertracing/jaeger:2.1.0
    ports:
      # trace viewer
      - "16686:16686"
      # OTLP over HTTP
      - "4318:4318"

volumes:
  postgres_data:
  localstack_data:
